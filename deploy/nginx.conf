# PondSite Load Balancer — nginx configuration
# Place this at /etc/nginx/sites-available/pondsite and symlink to sites-enabled/
#
# Upstream backend instances on ports 3001, 3002, 3003, 3004
# Each corresponds to one SSH session / PM2 process.
# SSH ports:  2205→instance-1, 2206→instance-2, 2207→instance-3, 2208→instance-4

upstream pondsite_backend {
    # Round-robin load balancing (nginx default)
    # least_conn;  # Uncomment for least-connections strategy

    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3004 max_fails=3 fail_timeout=30s;

    # Health-check keepalive connections
    keepalive 16;
}

server {
    listen 3000;
    server_name _;

    # Increase timeouts for long-running analysis requests (DEM fetch can take ~30s)
    proxy_connect_timeout   60s;
    proxy_send_timeout     120s;
    proxy_read_timeout     120s;

    # Forward all /api/* to the Node.js backends
    location /api/ {
        proxy_pass         http://pondsite_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Buffer settings for large file uploads (KML/KMZ)
        client_max_body_size 50m;
        proxy_request_buffering on;

        # Return 502 quickly if backend fails (triggers failover)
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Serve the built React SPA for all non-API routes
    location / {
        root /home/student/pond-planner-pro/dist;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Health check endpoint (returns load balancer status)
    location /lb-health {
        access_log off;
        return 200 '{"lb":"ok","upstream":"pondsite_backend"}';
        add_header Content-Type application/json;
    }

    # Access logs
    access_log /var/log/nginx/pondsite_access.log;
    error_log  /var/log/nginx/pondsite_error.log warn;
}
